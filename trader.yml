name: AI Stock Trader V11 Cloud

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: paper-trader-v11
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Check five stocks and Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_trader_v11.py
      - name: Save V11 paper portfolio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f v11_portfolio.json ]; then
            git add v11_portfolio.json
            if ! git diff --cached --quiet; then
              git commit -m "Update V11 paper portfolio [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
